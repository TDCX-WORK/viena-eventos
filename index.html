<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <!-- ── SEO básico ── -->
    <title>Salas de Reuniones en Madrid Centro | Suites Viena Plaza de España</title>
    <meta name="description" content="Alquiler de salas de reuniones en Madrid centro, junto a Plaza de España. 3 espacios de 27 a 61 m² con luz natural, WiFi, proyector y catering. Desde 190 €/media jornada. Reserva online." />
    <meta name="author" content="Suites Viena Plaza de España" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!-- ── Dominio oficial ──
         La web vive en suitesvienaeventos.com, SIN www. La versión con
         www responde también, pero con un 301 hacia aquí: hay una regla
         de redirección en Cloudflare que se encarga.

         ATENCIÓN: robots.txt y sitemap.xml TIENEN que decir este mismo
         dominio. Hasta ahora decían reservas.suitesviena.com y eso son
         dos señales contradictorias: Google elige él cuál indexa. Los
         dos ficheros van corregidos junto a este. -->
    <link rel="canonical" href="https://suitesvienaeventos.com/" />

    <!-- ── Rendimiento ──
         La foto del hero es el elemento LCP: lo que Google cronometra
         para decidir si la página "carga rápido". Se precarga aquí para
         que empiece a bajar al leer la primera línea del HTML, en
         paralelo con el bundle de React, en vez de esperar a que React
         monte el componente.

         Los nombres tienen que coincidir con los de Hero.jsx. Si se
         cambia la foto, se sustituyen los ficheros de /public sin
         renombrarlos y aquí no hay que tocar nada. -->
    <!-- Dos precargas, una por recorte. El `media` de cada una tiene que
         ser EXACTAMENTE el del <source> de Hero.jsx (max-width: 599px):
         si no coinciden, el móvil baja las dos fotos.

         scripts/prerender.js quita estas dos líneas en todas las páginas
         que no son la portada, porque allí no hay hero. -->
    <link rel="preload" as="image" href="/hero-vert-760.webp"
          imagesrcset="/hero-vert-500.webp 500w, /hero-vert-760.webp 760w"
          imagesizes="100vw" media="(max-width: 599px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/hero-2000.webp"
          imagesrcset="/hero-800.webp 800w, /hero-1280.webp 1280w, /hero-2000.webp 2000w"
          imagesizes="100vw" media="(min-width: 600px)" fetchpriority="high" />

    <!-- ── Tipografías ──
         Autoalojadas desde /fonts. Antes se pedían a
         fonts.googleapis.com, lo que mandaba la IP de cada visitante a
         Google sin habérselo preguntado a nadie y obligaba a abrir dos
         conexiones más (googleapis para el CSS, gstatic para los
         .woff2) antes de poder pintar una línea de texto.

         Ahora los @font-face están en src/styles/fuentes.css y los
         ficheros los baja `npm run fuentes` una sola vez.

         Las dos precargas son de las fuentes que se usan en la primera
         pantalla: Playfair en el titular del hero e Inter en todo lo
         demás. `crossorigin` es obligatorio aunque el fichero sea
         nuestro: las fuentes se piden siempre en modo anónimo y sin él
         el navegador descarga el fichero dos veces.

         La cursiva de Playfair NO se precarga: apenas se usa y puede
         llegar tarde sin que se note. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font"
          type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/playfair-latin.woff2" as="font"
          type="font/woff2" crossorigin />

    <!-- ── Favicon ──
         Apuntaba a /vite.svg, que no existe en /public: daba 404 en cada
         visita y la pestaña salía con el icono genérico. El fichero que
         sí está es favicon.svg.

         El ?v=2 obliga a navegadores y a la caché de Cloudflare a pedir
         el icono de nuevo. Si se cambia el icono, subir el número. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=2" />

    <!-- ── Geo tags (Madrid — C/ Juan Álvarez Mendizábal 17) ── -->
    <meta name="geo.region" content="ES-MD" />
    <meta name="geo.placename" content="Madrid" />
    <meta name="geo.position" content="40.425055;-3.714941" />
    <meta name="ICBM" content="40.425055, -3.714941" />

    <!-- ── Open Graph (WhatsApp, LinkedIn, Facebook) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Salas de Reuniones en Madrid Centro | Suites Viena" />
    <meta property="og:description" content="3 espacios únicos junto a Plaza de España. De 27 a 61 m², luz natural, equipamiento completo y catering. Desde 190 €. Reserva online." />
    <meta property="og:image" content="https://suitesvienaeventos.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sala de reuniones de Suites Viena Plaza de España, en Madrid centro" />
    <meta property="og:url" content="https://suitesvienaeventos.com/" />
    <meta property="og:site_name" content="Suites Viena Plaza de España" />
    <meta property="og:locale" content="es_ES" />

    <!-- ── Twitter Card ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Salas de Reuniones en Madrid Centro | Suites Viena" />
    <meta name="twitter:description" content="3 espacios únicos junto a Plaza de España. Desde 190 €. Reserva online." />
    <meta name="twitter:image" content="https://suitesvienaeventos.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Sala de reuniones de Suites Viena Plaza de España, en Madrid centro" />

    <!-- ── Datos estructurados: el negocio y sus salas ──
         Los genera scripts/prerender.js en el build, con los precios y
         las salas de Supabase (ver src/lib/seo.js). No escribir nada a
         mano aquí.

         Las preguntas frecuentes NO van aquí: las pinta el componente
         Faq junto al acordeón. Dos FAQPage en la misma página invalidan
         el marcado. -->
    <!--jsonld-negocio-->

    <!-- ── Estilos base ──
         Solo el fondo, para que no haya un fogonazo antes de index.css. -->
    <style>
      html, body, #root {
        background-color: #ffffff;
        min-height: 100vh;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <!-- ── Prerender ──
         En el build, scripts/prerender.js sustituye las dos marcas de
         abajo por el HTML real de la portada y por los datos con los que
         se generó. El navegador lo pinta al instante y React solo lo
         "hidrata" (le engancha los eventos) sin repintar nada.

         En `npm run dev` las marcas se quedan como comentarios y la app
         se monta desde cero, como siempre.

         /admin usa dist/admin/index.html: esta misma plantilla sin
         prerender y con noindex. -->
    <div id="root"><!--app-html--></div>
    <!--datos-iniciales-->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
