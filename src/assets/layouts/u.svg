  <circle cx="76" cy="18" r="3.5" stroke="currentColor" stroke-width="1.2"/>
  <circle cx="76" cy="30" r="3.5" stroke="currentColor" stroke-width="1.2"/>
  <circle cx="76" cy="42" r="3.5" stroke="currentColor" stroke-width="1.2"/>
  <circle cx="76" cy="54" r="3.5" stroke="currentColor" stroke-width="1.2"/>
  <!-- Sillas base exterior -->
